name: Bug
description: Something that doesn't work the way it should.
labels: ['type:bug']
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: The page URL, the environment (local, QA, staging, production), the browser and the screen width.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshots, console errors or failing test output. Never paste secrets or personal data.
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - p1 – blocks students or breaks production
        - p2 – wrong, but there's a workaround
        - p3 – cosmetic
    validations:
      required: true
